# This rule is not used by the project coraza-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to security.adversity.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: coraza-operator
    app.kubernetes.io/managed-by: kustomize
  name: ipblocklist-viewer-role
rules:
- apiGroups:
  - security.adversity.dev
  resources:
  - ipblocklists
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.adversity.dev
  resources:
  - ipblocklists/status
  verbs:
  - get
