apiVersion: security.adversity.dev/v1alpha1
kind: IPBlockList
metadata:
  labels:
    app.kubernetes.io/name: coraza-operator
    app.kubernetes.io/managed-by: kustomize
  name: ipblocklist-sample
spec:
  pollInterval: 5m
  sources:
    - type: Git
      git:
        url: https://github.com/your-org/blocklists.git
        branch: main
        path: lists/blocked-ips.txt
    - type: HTTP
      http:
        url: https://example.com/extra-blocklist.txt
  output:
    configMapName: community-blocklist
